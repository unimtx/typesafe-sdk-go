name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go version
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l .)"
      - run: go run ./internal/tools/surfacecheck

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: staticcheck ./...
